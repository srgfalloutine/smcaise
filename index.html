<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sama Caisse – Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F6C9;--sf:#fff;--ink:#141414;--mut:#5d5d4a;--line:rgba(20,20,20,.12);--g:#1FB77F;--gd:#0F3D2E;--y:#FBB800;--red:#C0392B;--d:Anton,Impact,"Arial Narrow",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12140b;--sf:#1e2214;--ink:#f4f4de;--mut:#b4b49a;--line:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#12140b;--sf:#1e2214;--ink:#f4f4de;--mut:#b4b49a;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;height:60px}
.logo{font:400 20px var(--d);letter-spacing:.6px;display:flex;align-items:center;gap:8px}.logo i{width:24px;height:24px;border-radius:50%;background:var(--y);border:2px solid var(--ink)}
.seg{display:flex;background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:3px}.seg button{border:0;background:none;padding:7px 12px;border-radius:99px;font-weight:600;font-size:13px;min-height:34px}.seg .on{background:var(--ink);color:var(--bg)}
.stage{display:flex;justify-content:center;padding:4px 12px 16px}
.phone{width:100%;max-width:400px;height:min(790px,calc(100dvh - 76px));background:var(--bg);border:2px solid var(--ink);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:8px 8px 0 var(--ink)}
@media(max-width:480px){.stage{padding:0}.phone{border:0;border-radius:0;box-shadow:none;height:calc(100dvh - 60px)}}
.screen{flex:1;overflow:auto;padding:16px 16px 20px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top small{color:var(--mut);display:block}.top b{font-size:18px}
.av{width:40px;height:40px;border-radius:50%;background:var(--y);border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;color:#141414;flex:none}
.hero{background:var(--gd);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden;width:100%;text-align:left;border:0;display:block}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--y);opacity:.95}
.hero small{opacity:.8;display:block}.amt{font:400 46px/1.1 var(--d);margin:4px 0 10px;position:relative;z-index:1}.amt s{text-decoration:none;font:600 14px Inter,sans-serif;opacity:.8;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;position:relative;z-index:1}
.ring{position:absolute;right:14px;top:14px;z-index:2;color:#141414;text-align:center;font:700 11px Inter}
.ring svg{display:block}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.qa button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-height:44px}
.qa span{width:54px;height:54px;border-radius:18px;background:var(--sf);border:1px solid var(--line);display:grid;place-items:center}
h2{font:400 24px/1.1 var(--d);letter-spacing:.4px;margin:18px 0 8px}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row>div{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.ico{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.pos{color:#0a7a52;font-weight:700}@media(prefers-color-scheme:dark){.pos{color:#4ee0a8}}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.btn{width:100%;min-height:50px;border-radius:16px;border:2px solid #141414;background:var(--y);color:#141414;font-weight:700;font-size:16px;margin-top:12px}.btn.g{background:var(--g);color:#06261a}.btn.o{background:none;color:var(--ink);border-color:var(--line)}.btn.s{width:auto;min-height:36px;padding:0 12px;font-size:13px;margin:0;border-radius:10px}
.btn:active{transform:scale(.98)}
.tag{font:700 11px Inter;padding:4px 9px;border-radius:99px;background:var(--y);color:#141414;white-space:nowrap}.tag.ok{background:var(--g);color:#06261a}.tag.no{background:var(--red);color:#fff}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));align-items:end}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-height:48px}nav .on{color:var(--ink)}nav .on svg{stroke-width:2.6}
nav .fab{width:58px;height:58px;border-radius:50%;background:var(--y);border:2px solid #141414;color:#141414;margin:-26px auto 0;justify-content:center;box-shadow:0 4px 0 #141414}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s;z-index:5}@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:28px 28px 0 0;padding:10px 20px 24px;z-index:6;animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:90%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.field{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 14px;font:400 34px var(--d);margin:6px 0}
select.field,input.field.sm{font:500 15px Inter}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}.chips .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pv{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:8px;min-height:42px}
input[type=range]{width:100%;accent-color:var(--g);height:32px}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--sf)}.dot.on{background:var(--g);border-color:var(--g);color:#06261a}.dot.cur{border-color:var(--y);box-shadow:0 0 0 4px rgba(251,184,0,.3)}
.empty{text-align:center;padding:22px 10px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.up{aspect-ratio:1.6;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-weight:600;font-size:13px;overflow:hidden;cursor:pointer;position:relative;background:var(--bg)}.up img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.up:focus-within{outline:3px solid var(--y)}.sr{position:absolute;opacity:0;width:1px;height:1px}
.wide{max-width:980px;margin:0 auto;padding:4px 14px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi .amt{font-size:30px;margin:2px 0}.kpi small{color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}.chart div{flex:1;background:var(--g);border-radius:8px 8px 2px 2px;position:relative;min-height:6px}.chart div:last-child{background:var(--y)}.chart span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}.scroll{overflow-x:auto}
.dial{background:#101612;flex:1;display:flex;align-items:center;padding:20px}.dlg{background:#f3f3ee;color:#141414;border-radius:6px;width:100%;padding:18px;box-shadow:0 8px 30px #000a;white-space:pre-wrap;font-size:15px}
.dlg input{width:100%;border:0;border-bottom:2px solid var(--g);background:none;font:inherit;padding:8px 0;margin-top:12px;color:#141414}.dlg .acts{display:flex;justify-content:flex-end;gap:20px;margin-top:14px;font-weight:700;color:#0a7a52}.dlg button{border:0;background:none;color:inherit;font-weight:700;min-height:40px;padding:0 4px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#141414;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:88%;display:flex;gap:8px;align-items:center}#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes pop{50%{transform:scale(1.03)}}.pulse{animation:pop .5s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="logo"><i></i>SAMA CAISSE</div><div class="seg" id="modes" role="tablist"></div></header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const N=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
const F=n=>N(n)+' FCFA';
const P={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',users:'M16 11a3 3 0 1 0 0-6M8 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20c0-3 3-5 6-5s6 2 6 5M15 15c4 0 7 1 7 5',plus:'M12 5v14M5 12h14',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',out:'M12 4v12m0 0l-5-5m5 5l5-5M5 20h14',back:'M15 5l-7 7 7 7',check:'M5 12l5 5 9-10',alert:'M12 8v5M12 17v.5M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',coin:'M12 7v10M9 9.5c0-1.5 6-1.5 6 0s-6 1.5-6 3 6 1.5 6 0',pig:'M4 12a8 7 0 0 1 16 0c0 3-2 5-4 6v2h-3v-1h-2v1H8v-2c-2-1-4-3-4-6z'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const S={kyc:{type:'cni',recto:null,verso:null,st:'none'},pol:null,comm:0,ins:{cat:'liv',form:'rc',freq:'an',plate:'',src:'ep'},onb:{step:0,phone:'',name:'',stop:'Colobane',pin:''},mode:'app',tab:'home',sheet:null,pct:5,op:'Wave',ep:18500,sol:3200,caisse:184500,credit:null,claims:[],last:18500,ctype:'Accident',lamt:0,why:'Panne moto',
 hist:[{t:'Course Colobane → Plateau',a:2500,d:'Hier'},{t:'Livraison Sacré-Cœur',a:1800,d:'Hier'},{t:'Course Pikine → Rufisque',a:4000,d:'Lundi'}],
 members:[['Moussa Diop',21400],['Ibrahima Sow',18900],['Cheikh Fall',15200],['Abdou Ndiaye',12000],['Pape Mbaye',9800],['Mamadou Ba',7300]],u:{step:'main',out:''}};
const COV=[{n:'Aucune',min:0,m:0},{n:'Basique',min:5000,m:100000},{n:'Standard',min:20000,m:300000},{n:'Premium',min:50000,m:1000000}];
const cov=(e=S.ep)=>COV.filter(c=>e>=c.min).pop(),nxt=()=>COV.find(c=>c.min>S.ep);
const cmax=()=>S.ep<5000?0:Math.min(Math.floor(S.ep*3/1000)*1000,100000);
function toast(m,ok=1){const t=$('#toast');t.innerHTML=(ok?ic('check',16):ic('alert',16))+m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
function go(m,t){S.mode=m;if(t)S.tab=t;S.sheet=null;render()}
function sheet(k){S.sheet=k;render();const a=$('#amt');if(a)a.focus()}
function set(k,v){S[k]=v;render()}

function prev(){const a=+($('#amt')||{}).value,p=a*S.pct/100,b=$('#pv');if(!b)return;
 if(S.sheet==='ride')b.innerHTML=a>0?`<b>${F(p)}</b> mis de côté automatiquement<br><span class="mut">${F(p*.8)} épargne · ${F(p*.2)} caisse de l’arrêt</span>`:'Saisissez le montant reçu pour voir la répartition.';
 if(S.sheet==='out'){b.innerHTML=a>S.ep?'Montant supérieur à votre épargne.':a>0?(cov(S.ep-a).n!==cov().n?`Attention : votre couverture passerait de <b>${cov().n}</b> à <b>${cov(S.ep-a).n}</b>.`:'Votre couverture reste inchangée.'):'Disponible : '+F(S.ep)}}
function chip(v){$('#amt').value=v;prev()}
function course(){const a=+$('#amt').value;if(!(a>0))return toast('Entrez un montant valide',0);
 const p=a*S.pct/100;S.ep+=p*.8;S.sol+=p*.2;S.caisse+=p*.2;S.hist.unshift({t:'Course via '+S.op,a,d:'À l’instant'});S.sheet=null;render();toast(F(p)+' épargnés')}
function retrait(){const a=+$('#amt').value;if(!(a>0)||a>S.ep)return toast('Montant invalide',0);if(S.onb.pin&&$('#pin').value!==S.onb.pin)return toast('PIN incorrect',0);S.ep-=a;S.sheet=null;render();toast(F(a)+' envoyés sur '+S.op)}
function declarer(){const c=cov();if(!c.m){S.sheet=null;render();return toast('Épargnez 5 000 FCFA pour activer la couverture',0)}
 S.claims.unshift({ty:S.ctype,m:S.ctype==='Décès'?c.m:Math.round(c.m*.3),st:'attente'});S.sheet=null;render();toast('Déclaration transmise à l’assureur')}
function demande(){if(S.credit)return;if(S.kyc.st!=='ok')return toast('Vérifiez d’abord votre identité',0);const a=S.lamt||Math.round(cmax()/2000)*1000;S.credit={a,fee:Math.round(a*.05),st:'attente',why:S.why};render();toast('Demande envoyée à la microfinance')}
function rembourser(){const c=S.credit;S.credit=null;render();toast('Crédit soldé : '+F(c.a+c.fee))}
function adm(k,i,ok){if(k==='c'){const c=S.claims[i];c.st=ok?'payé':'refusé';if(ok)S.hist.unshift({t:'Indemnité '+c.ty,a:c.m,d:'À l’instant'})}else if(S.credit){S.credit.st=ok?'actif':'refusé';if(!ok)S.credit=null}render();toast(ok?'Dossier approuvé':'Dossier refusé')}

function ussd(i){const u=S.u;i=(i||'').trim();const M='SAMA CAISSE\n1 Mon épargne\n2 Caisse de l’arrêt\n3 Protection\n4 Mini-crédit\n5 Enregistrer une recette\n6 Assurance moto\n0 Quitter';
 if(!u.out){u.out=M;u.step='main';return}
 if(u.step==='amt'){const a=+i;if(a>0){const p=a*S.pct/100;S.ep+=p*.8;S.sol+=p*.2;S.caisse+=p*.2;u.out=`Recette de ${F(a)} enregistrée.\n${F(p)} épargnés.\n\n0 Menu`}else u.out='Montant invalide.\n\n0 Menu';u.step='info';return}
 if(i==='0'||u.step==='info'){if(i==='0'&&u.step==='main'){u.out='';return}u.step='main';u.out=M;return}
 const c=cov();const o={1:`Épargne : ${F(S.ep)}\nTaux : ${S.pct} %`,2:`Caisse de l’arrêt : ${F(S.caisse)}\nMembres : ${S.members.length+1}`,3:`Couverture : ${c.n}\nCapital : ${F(c.m)}`,4:`Crédit possible : ${F(cmax())}\nFrais : 5 %`,6:S.pol?`Assurance ${S.pol.cat.n}\nActive jusqu’au ${S.pol.end}`:'Aucune assurance. Souscrivez dans l’application.'}[i];
 if(o){u.step='info';u.out=o+'\n\n0 Menu'}else if(i==='5'){u.step='amt';u.out='Montant de la recette (FCFA) :'}else u.out='Choix invalide.\n\n'+M}
function usend(){const e=$('#ui');ussd(e?e.value:'');render();const x=$('#ui');if(x)x.focus()}

const CATS=[{id:'perso',n:'Moto personnelle',d:'≤ 125 cm³, usage privé',rc:25000},{id:'liv',n:'Livreur',d:'Livraison de repas et colis',rc:35000},{id:'taxi',n:'Moto-taxi Jakarta',d:'Transport de personnes',rc:40000},{id:'gros',n:'Grosse cylindrée',d:'Plus de 125 cm³',rc:45000}];
const FORMS=[{id:'rc',n:'Responsabilité civile',d:'Obligatoire : dommages causés aux tiers',x:0},{id:'vol',n:'RC + Vol',d:'Ajoute le vol de la moto',x:24000},{id:'plus',n:'Complète',d:'RC + vol + corporel du conducteur (jusqu’à 8 M FCFA)',x:55000}];
const FREQ={an:['Annuel',1],mois:['Mensuel',12],jour:['Journalier',365]};
const prime=()=>CATS.find(c=>c.id===S.ins.cat).rc+FORMS.find(f=>f.id===S.ins.form).x;
const inst=(p,f)=>Math.ceil(p/FREQ[f][1]);
const dt=y=>{const d=new Date();d.setFullYear(d.getFullYear()+y);return d.toLocaleDateString('fr-FR')};
function souscrire(){const i=S.ins;if(!i.plate.trim())return toast('Entrez le numéro d’immatriculation',0);
 if(S.onb.pin&&$('#ipin').value!==S.onb.pin)return toast('PIN incorrect',0);
 const p=prime(),a=inst(p,i.freq);if(i.src==='ep'&&a>S.ep)return toast('Épargne insuffisante pour la première échéance',0);
 if(i.src==='ep')S.ep-=a;S.comm+=a*.02;
 S.pol={cat:CATS.find(c=>c.id===i.cat),form:FORMS.find(f=>f.id===i.form),plate:i.plate.trim().toUpperCase(),price:p,freq:i.freq,paid:a,start:dt(0),end:dt(1),no:'SC-'+Date.now().toString().slice(-6)};
 render();toast('Assurance activée')}
function payInst(){const q=S.pol,a=Math.min(inst(q.price,q.freq),q.price-q.paid);if(a<=0)return;if(S.ins.src==='ep'){if(a>S.ep)return toast('Épargne insuffisante',0);S.ep-=a}q.paid+=a;S.comm+=a*.02;render();toast('Échéance payée : '+F(a))}
function insView(){const i=S.ins,p=prime(),a=inst(p,i.freq),q=S.pol;
 const back=`<div class="top"><button class="btn o s" onclick="go('app','cover')" aria-label="Retour">${ic('back',18)}</button><b>Assurance moto</b><span style="width:36px"></span></div>`;
 if(q){const left=q.price-q.paid,x=Math.min(inst(q.price,q.freq),left);return back+`<div class="hero" style="cursor:default"><small>Police ${q.no} · ${q.plate}</small><div class="amt" style="font-size:34px">${q.cat.n}</div><span class="chip">${ic('shield',14)} Active jusqu’au ${q.end}</span></div><div class="card"><div class="row"><div>Formule</div><b>${q.form.n}</b></div><div class="row"><div>Prime annuelle</div><b>${F(q.price)}</b></div><div class="row"><div>Déjà payé</div><b>${F(q.paid)}</b></div><div class="row"><div>Reste à payer</div><b>${F(left)}</b></div><div class="bar"><i style="width:${q.paid/q.price*100}%"></i></div>${left>0?`<button class="btn g" onclick="payInst()">Payer l’échéance (${F(x)})</button>`:'<p class="mut">Prime entièrement réglée.</p>'}</div><div class="card"><h3>Attestation numérique (démo)</h3><p class="mut">En cas de contrôle, présentez le numéro de police <b>${q.no}</b>.</p></div>`}
 const opt=(k,v,t,d,r)=>`<button class="card" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid ${i[k]===v?'var(--g)':'var(--line)'}" onclick="S.ins.${k}='${v}';render()"><span><b>${t}</b><span class="mut" style="display:block">${d}</span></span><b>${r}</b></button>`;

 <div class="card"><h3>Vérification d’identité</h3>${S.kyc.st==='attente'?`<div class="row"><div><b>${S.onb.name||'Fallou Tine'} · ${S.kyc.type==='cni'?'Carte d’identité':'Permis de conduire'}</b><small>Recto et verso reçus</small><div style="display:flex;gap:8px;margin-top:8px"><img src="${S.kyc.recto}" alt="Recto" style="width:110px;border-radius:8px"><img src="${S.kyc.verso}" alt="Verso" style="width:110px;border-radius:8px"></div></div><button class="btn g s" onclick="admK(1)">Valider</button><button class="btn o s" onclick="admK(0)">Refuser</button></div>`:'<div class="empty">Aucun document à vérifier.</div>'}</div><div class="card"><h3>Responsable d’arrêt · nouveaux membres</h3>${S.onb.step===4?`<div class="row"><div><b>${S.onb.name} · ${S.onb.phone}</b><small>Demande de rattachement à l’arrêt ${S.onb.stop}</small></div><button class="btn g s" onclick="S.onb.step=5;render();toast('Membre confirmé')">Confirmer</button></div>`:'<div class="empty">Aucune demande de rattachement.</div>'}</div><div class="card"><h3>À valider</h3>${pend.map(o=>`<div class="row"><div><b>Sinistre ${o.x.ty}</b><small>Fallou Tine · ${F(o.x.m)}</small></div><button class="btn g s" onclick="adm('c',${o.i},1)">Approuver</button><button class="btn o s" onclick="adm('c',${o.i},0)">Refuser</button></div>`).join('')}${cp?`<div class="row"><div><b>Mini-crédit ${S.credit.why}</b><small>Fallou Tine · ${F(S.credit.a)}</small></div><button class="btn g s" onclick="adm('k',0,1)">Approuver</button><button class="btn o s" onclick="adm('k',0,0)">Refuser</button></div>`:''}${pend.length||cp?'':'<div class="empty">Aucun dossier en attente.<br>Créez-en un depuis l’application.</div>'}</div>
 <div class="card scroll"><h3>Arrêt Colobane</h3><table><tr><th>Membre</th><th>Cotisations</th><th>Statut</th></tr>${[['Fallou Tine',S.sol],...S.members].map(m=>`<tr><td>${m[0]}</td><td>${F(m[1])}</td><td><span class="tag ok">Actif</span></td></tr>`).join('')}</table></div>
 <p class="mut">Prototype de démonstration : données fictives, aucune opération financière réelle.</p></div>`}
render();
</script>
